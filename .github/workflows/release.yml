name: Release

# Push a tag like v2.1.0 (or run it by hand) → Windows and Linux builds → Arcadia is installed and started
# in clean Arch Linux and Fedora containers → one GitHub Release with the Windows installer + portable zip
# and the Linux .deb, .rpm and AppImage (only if every step passed).
# Release text: .github/release-notes/<tag>.md (optional).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v2.1.0)'
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  # manual run: build the current main; the publish step creates the tag on that commit
  REF: ${{ github.event_name == 'push' && github.ref || 'main' }}

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: npm ci
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build installer
        run: npx tauri build --bundles nsis
      - name: Collect files
        shell: pwsh
        run: |
          $v = "$env:TAG".TrimStart('v')
          New-Item -ItemType Directory -Force out, portable | Out-Null
          Copy-Item (Get-ChildItem src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1) "out/Arcadia-Setup-$v.exe"
          Copy-Item src-tauri/target/release/Arcadia.exe portable/
          if (Test-Path src-tauri/target/release/WebView2Loader.dll) { Copy-Item src-tauri/target/release/WebView2Loader.dll portable/ }
          "Arcadia portable`r`nЗапустите Arcadia.exe. Данные хранятся в %APPDATA%\Arcadia" | Set-Content -Encoding utf8 portable/README.txt
          Compress-Archive -Path portable/* -DestinationPath "out/Arcadia-Portable-$v.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*

  linux:
    # the oldest supported Ubuntu: the binaries then run on newer distributions too (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf file
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Tauri CLI
        run: npm ci
      - name: Tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Build .deb, .rpm and AppImage
        run: npx tauri build --bundles deb,rpm,appimage
      - name: Collect files
        run: |
          v="${TAG#v}"
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/*.deb "out/arcadia_${v}_amd64.deb"
          cp src-tauri/target/release/bundle/rpm/*.rpm "out/arcadia-${v}-1.x86_64.rpm"
          cp src-tauri/target/release/bundle/appimage/*.AppImage "out/Arcadia-${v}-x86_64.AppImage"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: out/*

  # install and start it like a user would, on distributions other than the build machine
  distro-test:
    needs: linux
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [archlinux, fedora]
    container: ${{ matrix.distro == 'archlinux' && 'archlinux:latest' || 'fedora:latest' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux
          path: pkg
      - name: Install (Arch — package from the .deb, like packaging/arch/PKGBUILD)
        if: matrix.distro == 'archlinux'
        run: |
          pacman -Syu --noconfirm webkit2gtk-4.1 gtk3 libayatana-appindicator xorg-server-xvfb imagemagick procps-ng libarchive ttf-dejavu
          mkdir deb && cd deb && bsdtar -xf ../pkg/*.deb && bsdtar -xf data.tar.* -C /
      - name: Install (Fedora — the .rpm with its dependencies)
        if: matrix.distro == 'fedora'
        run: |
          dnf install -y ./pkg/*.rpm xorg-x11-server-Xvfb ImageMagick procps-ng dejavu-sans-fonts
          rpm -qR arcadia | grep -i -E "webkit|gtk" || true
      - name: Start Arcadia (installed package)
        run: |
          set -x
          ldd /usr/bin/Arcadia | grep "not found" && exit 1 || true
          Xvfb :99 -screen 0 1400x900x24 & sleep 2
          export DISPLAY=:99 ARCADIA_DATA=$PWD/data
          /usr/bin/Arcadia > app.log 2>&1 & PID=$!
          sleep 25
          import -window root shot-${{ matrix.distro }}.png || true
          if ! kill -0 $PID; then echo "Arcadia exited"; cat app.log; exit 1; fi
          kill $PID; cat app.log | tail -20
          ls -la data || true
      - name: Start the AppImage
        run: |
          chmod +x pkg/*.AppImage
          export DISPLAY=:99 ARCADIA_DATA=$PWD/data2 APPIMAGE_EXTRACT_AND_RUN=1
          pgrep Xvfb || (Xvfb :99 -screen 0 1400x900x24 & sleep 2)
          ./pkg/*.AppImage > appimage.log 2>&1 & PID=$!
          sleep 25
          import -window root appimage-${{ matrix.distro }}.png || true
          if ! kill -0 $PID; then echo "AppImage exited"; cat appimage.log; exit 1; fi
          kill $PID; tail -20 appimage.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-${{ matrix.distro }}
          path: |
            *.png
            *.log

  publish:
    needs: [windows, linux, distro-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REF }}
      - uses: actions/download-artifact@v4
        with:
          pattern: '{windows,linux}'
          path: out
          merge-multiple: true
      - name: Release notes
        run: |
          f=".github/release-notes/$TAG.md"
          [ -f "$f" ] || echo "Arcadia ${TAG#v}" > "$f"
          echo "NOTES=$f" >> "$GITHUB_ENV"
          ls -la out
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Arcadia ${{ env.TAG }}
          body_path: ${{ env.NOTES }}
          target_commitish: ${{ github.sha }}
          files: out/*
