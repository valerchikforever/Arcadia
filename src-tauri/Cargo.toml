[package]
name = "arcadia"
default-run = "Arcadia"
version = "2.2.0"
description = "Arcadia — единый лаунчер игр"
authors = ["valerchikforever"]
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "Arcadia"
path = "src/main.rs"

[lib]
name = "arcadia_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "net", "process", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "cookies"] }
regex = "1"
fancy-regex = "0.14"
once_cell = "1"
sha1 = "0.10"
base64 = "0.22"
url = "2"
urlencoding = "2"
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
log = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_Threading",
  "Win32_Networking_WinInet",
  "Win32_Security_Cryptography",
  "Win32_System_Memory",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
